[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion2-farmer"
version = "0.4.0"
description = "Windows-ready modular AION 2 farming bot"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "mss>=10,<11",
]

[project.scripts]
aion2-farmer = "main:main"

[tool.setuptools]
packages = ["actions", "config", "core", "runtime", "vision"]

[tool.pytest.ini_options]
pythonpath = ["."]
